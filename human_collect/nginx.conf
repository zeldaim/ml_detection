# 실제 IP 는 기록하지 않는다 — 첫 칸에 참가자 ID($remote_user)만. 시각은 UTC 오프셋 포함.
# 마지막 칸 $upstream_addr: '-' 면 Juice Shop 까지 안 간 요청(기본 인증 실패 401) → 변환 때 뺀다.
#   (앱의 진짜 로그인 실패 401 은 upstream 이 있으므로 남는다)
log_format human '$remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $upstream_addr';

server {
    listen 80;

    auth_basic "experiment";
    auth_basic_user_file /etc/nginx/htpasswd;

    access_log /var/log/nginx-human/access.log human;

    location / {
        proxy_pass http://juice:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;     # Juice Shop 알림(socket.io)
        proxy_set_header Connection "upgrade";
        # 인증 헤더는 Juice Shop 으로 넘기지 않는다 (앱 자체 로그인 토큰과 섞이지 않게)
        proxy_set_header Authorization "";
    }
}
