# ML PC(분석 PC) 로그 수신기 — 받은 로그를 원문 한 줄 그대로 inbox/live/ 에 파일로 쌓는다.  (docs/29)
#
#   [랩 VM]      Filebeat  ──(Beats, TLS :5044)──┐
#   [원격 Wazuh] Fluent Bit ──(TCP json, TLS :5045)┤─▶ 이 파이프라인 ─▶ inbox/live/<출처>/<로그종류>/<보낸호스트>-<날짜>.log
#                                                  ▼
#                               python ml/ingest.py inbox/live/<출처>/<로그종류> --retrain
#
# 원칙: 파싱은 여기서 하지 않는다(원문 보존 → 피처는 ml/ 가 같은 코드로). 여기는 '받아서 제자리에 놓기'만.
# 검증: bin\logstash.bat -f deploy\collect\logstash\ml-ingest.conf --config.test_and_exit
# 옵션명은 Logstash 8.x 기준(8.13+ 의 ssl_enabled 등). 다른 버전이면 test_and_exit 오류를 보고 맞춘다.

input {
  # 랩 VM 의 Filebeat
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "D:/ml_detection/deploy/collect/certs/server.crt"
    ssl_key => "D:/ml_detection/deploy/collect/certs/server.pkcs8.key"     # beats 입력은 PKCS#8 키
    ssl_certificate_authorities => ["D:/ml_detection/deploy/collect/certs/ca.crt"]
    ssl_client_authentication => "required"                                  # 우리 CA 가 서명한 에이전트만
  }
  # 원격 Wazuh manager 등 Fluent Bit (json_lines)
  tcp {
    port => 5045
    codec => json_lines
    ssl_enabled => true
    ssl_certificate => "D:/ml_detection/deploy/collect/certs/server.crt"
    ssl_key => "D:/ml_detection/deploy/collect/certs/server.key"
    ssl_certificate_authorities => ["D:/ml_detection/deploy/collect/certs/ca.crt"]
    ssl_client_authentication => "required"
  }
}

filter {
  # Fluent Bit tail 은 원문을 "log" 키에 담는다 → Filebeat 와 같게 message 로
  if [log] {
    mutate { rename => { "log" => "message" } }
  }
  # 출처·종류·보낸 호스트를 @metadata 로 통일 (파일 경로에만 쓰고 출력엔 안 남김)
  if [fields][source] {
    mutate { add_field => {
      "[@metadata][source]"   => "%{[fields][source]}"
      "[@metadata][log_type]" => "%{[fields][log_type]}"
      "[@metadata][src_host]" => "%{[host][name]}"
    } }
  } else {
    mutate { add_field => {
      "[@metadata][source]"   => "%{source}"
      "[@metadata][log_type]" => "%{log_type}"
      "[@metadata][src_host]" => "%{src_host}"
    } }
  }
  # 출처/종류를 못 정한 이벤트는 따로 모아 확인 — 치환 전에 검사(치환 후엔 %{ 가 사라짐) (조용히 섞이지 않게)
  if [@metadata][source] =~ /%\{/ or [@metadata][log_type] =~ /%\{/ {
    mutate { replace => { "[@metadata][source]" => "_unlabeled" "[@metadata][log_type]" => "_unlabeled" } }
  }
  # 경로 조작 방지: 보내는 쪽이 정한 값이 파일 경로가 되므로 허용 문자만 남긴다 ('../' 등 차단)
  mutate {
    gsub => [
      "[@metadata][source]",   "[^A-Za-z0-9_.-]", "_",
      "[@metadata][log_type]", "[^A-Za-z0-9_.-]", "_",
      "[@metadata][src_host]", "[^A-Za-z0-9_.-]", "_",
      "[@metadata][source]",   "^\.+", "_",
      "[@metadata][log_type]", "^\.+", "_",
      "[@metadata][src_host]", "^\.+", "_"
    ]
  }
}

output {
  file {
    # 날짜는 수신 시각(UTC) 기준 — 원문 안의 시각은 그대로 남아 ml/ 가 그걸로 구간을 나눈다
    path => "D:/ml_detection/inbox/live/%{[@metadata][source]}/%{[@metadata][log_type]}/%{[@metadata][src_host]}-%{+YYYY-MM-dd}.log"
    codec => line { format => "%{message}" }      # 원문 한 줄 그대로 (nginx 줄 / archives JSON 줄)
    create_if_deleted => true
  }
}
