# 원격 Wazuh manager 의 archives.json 을 우리 ML PC Logstash 로.  (docs/29 §4-4)
# 그쪽 Wazuh·SIEM 은 그대로 두고, 파일만 읽어서 '복사본'을 보낸다(에이전트를 우리 쪽으로 돌리지 않음).
# 전제: 그쪽 manager ossec.conf 에 <logall_json>yes</logall_json> (없으면 경보만 남아 ML 에 쓸모 없음)
#
# 설치 후 /etc/fluent-bit/fluent-bit.conf 로.  검사: fluent-bit -c /etc/fluent-bit/fluent-bit.conf --dry-run
# 같은 서버에 Wazuh 용 Filebeat 가 이미 돌고 있으므로 Filebeat 를 하나 더 깔지 않고 Fluent Bit 를 쓴다(충돌 방지).
# 주의: 이 형식은 값 뒤에 붙인 '#' 주석을 지원하지 않는다 → 주석은 항상 별도 줄에.
#
# 상대마다 바꿀 곳 3개: record source / record src_host / OUTPUT host

[SERVICE]
    flush           5
    log_level       info
    # ML PC 가 꺼져 있어도 디스크에 쌓았다가 재전송
    storage.path    /var/lib/fluent-bit/buffer

[INPUT]
    name            tail
    path            /var/ossec/logs/archives/archives.json
    # 읽은 위치 기억 → 재시작 후 이어서
    db              /var/lib/fluent-bit/archives.pos
    # 설치 시점 이후부터 (과거분은 따로 합의해 파일로 받아 inbox/ 에)
    read_from_head  false
    storage.type    filesystem
    mem_buf_limit   50MB

[FILTER]
    name            record_modifier
    match           *
    # 출처 이름(폴더 inbox/live/<source>/) — 상대마다 다르게
    record          source    team_b
    record          log_type  wazuh_archives
    # 이 manager 를 부를 이름(파일명 앞부분)
    record          src_host  wazuh-teamb

[OUTPUT]
    name            tcp
    match           *
    # ML PC 주소 — 인터넷 너머면 VPN 주소 (docs/29 §4-4)
    host            ML_PC_ADDRESS
    port            5045
    format          json_lines
    tls             on
    tls.verify      on
    tls.ca_file     /etc/fluent-bit/certs/ca.crt
    # make_certs.sh client wazuh-teamb 로 만든 것
    tls.crt_file    /etc/fluent-bit/certs/wazuh-teamb.crt
    tls.key_file    /etc/fluent-bit/certs/wazuh-teamb.key
    retry_limit     no_limits
